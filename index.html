<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZERTY TOOL - Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid #30363d;padding:20px 30px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.5rem;color:#00ff88;letter-spacing:2px}
.header .stats{display:flex;gap:20px}
.stat-box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 18px;text-align:center}
.stat-box .num{font-size:1.6rem;font-weight:700;color:#00ff88}
.stat-box .label{font-size:.75rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
.refresh-bar{background:#161b22;padding:8px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #21262d;font-size:.8rem;color:#8b949e}
.refresh-bar button{background:#238636;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem}
.refresh-bar button:hover{background:#2ea043}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:20px 30px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;transition:border-color .2s}
.card:hover{border-color:#00ff88}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-name{font-weight:700;font-size:1rem}
.badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.badge.online{background:#0d2818;color:#3fb950;border:1px solid #238636}
.badge.offline{background:#2d1215;color:#f85149;border:1px solid #da3633}
.card-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.85rem;border-bottom:1px solid #21262d}
.card-row:last-child{border:none}
.card-row .k{color:#8b949e}
.card-row .v{color:#e0e0e0;font-weight:500}
.gpu-bar{height:6px;background:#21262d;border-radius:3px;margin-top:8px;overflow:hidden}
.gpu-bar .fill{height:100%;border-radius:3px;transition:width .5s}
.empty{text-align:center;padding:60px 20px;color:#8b949e}
.empty h2{color:#30363d;margin-bottom:10px}
@media(max-width:600px){.header{flex-direction:column;gap:12px}.header .stats{width:100%;justify-content:center}.grid{padding:12px}}
</style>
</head>
<body>
<div class="header">
  <h1>AZERTY TOOL</h1>
  <div class="stats">
    <div class="stat-box"><div class="num" id="total">0</div><div class="label">Machines</div></div>
    <div class="stat-box"><div class="num" id="online">0</div><div class="label">En ligne</div></div>
    <div class="stat-box"><div class="num" id="offline">0</div><div class="label">Hors ligne</div></div>
    <div class="stat-box"><div class="num" id="avg-gpu">0%</div><div class="label">GPU Moyen</div></div>
  </div>
</div>
<div class="refresh-bar">
  <span>Mise a jour auto toutes les 30s — <span id="last-update">...</span></span>
  <button onclick="loadData()">Actualiser</button>
</div>
<div class="grid" id="grid"></div>
<script>
const SUPABASE_URL='https://imwdpuumpvecpziigsyz.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imltd2RwdXVtcHZlY3B6aWlnc3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNTU4MDIsImV4cCI6MjExMDgzMTgwMn0.xK1YmdiLQ8yyWnvq4XX1KUakMoudHSCuwoN63lBIu8w';

async function loadData(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/machines?select=*&order=hostname',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    const data=await r.json();
    if(!Array.isArray(data)){
      document.getElementById('grid').innerHTML='<div class="empty"><h2>Erreur API</h2><p>'+(data.message||JSON.stringify(data))+'</p></div>';
      return;
    }
    render(data);
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty"><h2>Erreur de connexion</h2><p>'+e.message+'</p></div>';
  }
}

function render(machines){
  const now=Date.now();
  if(!machines||!machines.length){machines=[];}
  machines.forEach(m=>{
    const lastSeen=new Date(m.last_seen).getTime();
    m._online=(now-lastSeen)<300000;
  });
  const total=machines.length;
  const onlineCount=machines.filter(m=>m._online).length;
  const offlineCount=total-onlineCount;
  const avgGpu=total>0?Math.round(machines.reduce((s,m)=>s+m.gpu_usage_percent,0)/total):0;
  document.getElementById('total').textContent=total;
  document.getElementById('online').textContent=onlineCount;
  document.getElementById('offline').textContent=offlineCount;
  document.getElementById('avg-gpu').textContent=avgGpu+'%';
  document.getElementById('last-update').textContent=new Date().toLocaleTimeString('fr-FR');
  const grid=document.getElementById('grid');
  if(total===0){
    grid.innerHTML='<div class="empty"><h2>Aucune machine detectee</h2><p>Lancez AZERTY_TOOL.exe sur vos machines</p></div>';
    return;
  }
  grid.innerHTML=machines.map(m=>{
    const status=m._online?'online':'offline';
    const statusLabel=m._online?'En ligne':'Hors ligne';
    const gpuColor=m.gpu_usage_percent>70?'#f85149':m.gpu_usage_percent>40?'#d29922':'#3fb950';
    const upH=Math.floor(m.uptime_minutes/60);
    const upM=m.uptime_minutes%60;
    const lastSeenStr=new Date(m.last_seen).toLocaleString('fr-FR');
    return '<div class="card"><div class="card-header"><span class="card-name">'+esc(m.hostname)+'</span><span class="badge '+status+'">'+statusLabel+'</span></div><div class="card-row"><span class="k">GPU</span><span class="v">'+esc(m.gpu_name||"\u2014")+'</span></div><div class="card-row"><span class="k">Vendeur</span><span class="v">'+esc(m.gpu_vendor||"\u2014")+'</span></div><div class="card-row"><span class="k">Utilisation GPU</span><span class="v" style="color:'+gpuColor+'">'+m.gpu_usage_percent+'%</span></div><div class="gpu-bar"><div class="fill" style="width:'+m.gpu_usage_percent+'%;background:'+gpuColor+'"></div></div><div class="card-row"><span class="k">Temperature</span><span class="v">'+m.gpu_temp_c+'&deg;C</span></div><div class="card-row"><span class="k">IP</span><span class="v">'+esc(m.ip_address||"\u2014")+'</span></div><div class="card-row"><span class="k">Uptime</span><span class="v">'+upH+'h '+upM+'m</span></div><div class="card-row"><span class="k">Dernier signal</span><span class="v">'+lastSeenStr+'</span></div></div>';
  }).join('');
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

loadData();
setInterval(loadData,30000);
</script>
</body>
</html>
